# Isolated WordPress + MySQL + Redis stack for PigCache E2E tests.
# The plugin is mounted read-only so tests always run against the working tree.
#
# Usage:
#   cd PigCache/tests/docker
#   bash setup.sh          # first-time init (installs WP + plugin + debug constants)
#   docker compose up -d   # start services on subsequent runs
#   docker compose down -v # teardown + wipe volumes

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  wordpress:
    build:
      context: .
      args:
        WP_VERSION: ${WP_VERSION:-7.1}
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: pigcache-test-wordpress:wp${WP_VERSION:-7.1}-php${PHP_VERSION:-8.2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Override with PIGCACHE_TEST_PORT if 9520 collides with another project.
      - "${PIGCACHE_TEST_PORT:-9520}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DEBUG: "1"
      PIGCACHE_TEST_PORT: ${PIGCACHE_TEST_PORT:-9520}
    volumes:
      # Shared volume for the entire WordPress root (populated by the WP entrypoint).
      - wp_html:/var/www/html
      # Plugin bind-mount overlays on top of the named volume for this path.
      # Defaults to the working tree, which is the Pro configuration. `run.sh free`
      # points it at an extracted Free ZIP instead, so the exact artefact that
      # ships to WordPress.org gets the same test run.
      - ${PIGCACHE_SOURCE:-../..}:/var/www/html/wp-content/plugins/pigcache:ro
      # PigCache constants. setup.sh requires this from the top of wp-config.php
      # rather than using WORDPRESS_CONFIG_EXTRA, which newer WordPress images
      # no longer apply.
      - ./wp-config-extra.php:/var/www/html/pigcache-test-config.php:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 10s
      retries: 18

  # WP-CLI sidecar — used only by setup.sh, not kept running.
  wpcli:
    image: wordpress:cli-php${PHP_VERSION:-8.2}
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp_html:/var/www/html
      - ${PIGCACHE_SOURCE:-../..}:/var/www/html/wp-content/plugins/pigcache:ro
      - ./wp-config-extra.php:/var/www/html/pigcache-test-config.php:ro
    profiles:
      - setup
    # Numeric UID on purpose. The CLI image is Alpine-based and its `www-data`
    # resolves to a different UID than the Debian-based WordPress image, so
    # using the name here makes WP-CLI unable to write the drop-ins into
    # wp-content. 33 is www-data in the Apache image that owns the volume.
    user: "33:33"
    entrypoint: ["wp", "--path=/var/www/html", "--allow-root"]

volumes:
  db_data:
  wp_html:
